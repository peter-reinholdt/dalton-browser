<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dalton molecular viewer</title>
    <style>
      [hidden] {
        display: none !important;
      }
      html,
      body,
      #applet {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f8f1;
      }
      #message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 12px system-ui;
        color: #7a8f76;
        padding: 25px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="applet"></div>
    <div id="message">Loading molecular viewer…</div>
    <script type="module" src="./viewer-frame.mjs"></script>
  </body>
</html>
